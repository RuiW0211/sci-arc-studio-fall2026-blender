<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-1 LiDAR Preview</title>
<style>
  :root { --bg: #f4f4f2; --fg: #111; --muted: #777; --panel: rgba(255,255,255,.88); --line: #ddd; --accent: #111; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0d0d; --fg: #eee; --muted: #999; --panel: rgba(20,20,20,.85); --line: #333; --accent: #eee; } }
  :root[data-theme="dark"] { --bg: #0d0d0d; --fg: #eee; --muted: #999; --panel: rgba(20,20,20,.85); --line: #333; --accent: #eee; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; top: 16px; left: 16px; background: var(--panel); border: 1px solid var(--line);
    padding: 12px 14px; max-width: 280px; backdrop-filter: blur(6px); }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  .sub { color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
  button { font: inherit; background: none; color: var(--fg); border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; }
  button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  input[type=range] { width: 120px; }
  .small { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #status { position: fixed; bottom: 16px; left: 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="ui">
  <h1>Angels Knoll / Y-1 · LiDAR</h1>
  <div class="sub">USGS 3DEP 2023 · <span id="count">…</span> points</div>
  <div class="row">Color
    <button data-mode="height" class="on">Height</button>
    <button data-mode="class">Ground / other</button>
    <button data-mode="intensity">Intensity</button>
  </div>
  <div class="row">Size <input id="size" type="range" min="0.5" max="4" step="0.1" value="1.4"></div>
  <div class="row"><button id="y1" class="on">Y-1 outline</button><button id="top">Top view</button><button id="home">Reset</button></div>
  <div class="small">Drag to orbit · right-drag to pan · scroll to zoom</div>
</div>
<div id="status">Loading points…</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// scene frame: three.js x = east, y = up, z = -north (metres, origin = site origin)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const HOME = { pos: [260, 260, 300], target: [0, 100, 0] };
function home() { camera.position.set(...HOME.pos); controls.target.set(...HOME.target); }
home();

const bg = () => getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
scene.background = new THREE.Color(bg());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => scene.background.set(bg()));

const meta = await (await fetch("data/lidar_points.json")).json();
const buf = await (await fetch("data/lidar_points.bin")).arrayBuffer();
const n = meta.count, dv = new DataView(buf);
const pos = new Float32Array(n * 3), cls = new Uint8Array(n), inten = new Uint8Array(n), zs = new Float32Array(n);
for (let i = 0; i < n; i++) {
  const o = i * meta.record_bytes;
  const x = dv.getInt16(o, true) * meta.scale, y = dv.getInt16(o + 2, true) * meta.scale;
  const z = dv.getInt16(o + 4, true) * meta.scale + meta.z_base;
  pos[i * 3] = x; pos[i * 3 + 1] = z; pos[i * 3 + 2] = -y;
  zs[i] = z; cls[i] = dv.getUint8(o + 6); inten[i] = dv.getUint8(o + 7);
}
document.getElementById("count").textContent = n.toLocaleString();

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const col = new Float32Array(n * 3);
geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
const mat = new THREE.PointsMaterial({ size: 1.4, vertexColors: true, sizeAttenuation: false });
scene.add(new THREE.Points(geo, mat));

// colour ramps
const ramp = [[0.18, 0.20, 0.45], [0.13, 0.55, 0.60], [0.55, 0.78, 0.35], [0.98, 0.85, 0.30], [0.85, 0.35, 0.20]];
function rampAt(t) {
  t = Math.min(Math.max(t, 0), 1) * (ramp.length - 1);
  const k = Math.min(Math.floor(t), ramp.length - 2), f = t - k, a = ramp[k], b = ramp[k + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function paint(mode) {
  for (let i = 0; i < n; i++) {
    let c;
    if (mode === "height") c = rampAt((zs[i] - 78) / 60);           // 78-138 m spans the site; towers saturate
    else if (mode === "class") c = cls[i] === 2 ? [0.72, 0.60, 0.42] : (zs[i] > 140 ? [0.55, 0.58, 0.62] : [0.30, 0.52, 0.36]);
    else { const g = 0.15 + inten[i] / 255 * 0.85; c = [g, g, g]; }
    col.set(c, i * 3);
  }
  geo.attributes.color.needsUpdate = true;
}
paint("height");

// Y-1 parcel outline (APN 5149-010-951) from the pipeline's scene.json
let outline;
try {
  const ring = (await (await fetch("data/y1_parcel.json")).json())["5149-010-951"];
  const pts = ring.concat([ring[0]]).map(([x, y, z]) => new THREE.Vector3(x, z + 1.5, -y));
  outline = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
                           new THREE.LineBasicMaterial({ color: 0xe0301e }));
  scene.add(outline);
} catch (e) { console.warn("no parcel outline", e); }

document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("on", x === b));
  paint(b.dataset.mode);
});
document.getElementById("size").oninput = e => mat.size = +e.target.value;
document.getElementById("y1").onclick = e => { if (outline) { outline.visible = !outline.visible; e.target.classList.toggle("on", outline.visible); } };
document.getElementById("top").onclick = () => { camera.position.set(0, 900, 0.01); controls.target.set(0, 100, 0); };
document.getElementById("home").onclick = home;
document.getElementById("status").textContent = "";

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
