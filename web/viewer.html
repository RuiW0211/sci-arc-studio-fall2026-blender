<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-1 Site Viewer</title>
<style>
  :root { --bg: #f4f4f2; --fg: #111; --muted: #777; --panel: rgba(255,255,255,.9); --line: #ddd; --accent: #111; --bg3d: #eceae6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0d0d; --fg: #eee; --muted: #999; --panel: rgba(20,20,20,.86); --line: #333; --accent: #eee; --bg3d: #121212; } }
  :root[data-theme="dark"] { --bg: #0d0d0d; --fg: #eee; --muted: #999; --panel: rgba(20,20,20,.86); --line: #333; --accent: #eee; --bg3d: #121212; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  canvas { display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
  #ui { top: 16px; left: 16px; padding: 12px 14px; width: 252px; max-height: calc(100% - 64px); overflow: auto; }
  #ui.collapsed .body { display: none; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); margin: 2px 0 10px; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 4px; }
  .seg { display: flex; border: 1px solid var(--line); }
  .seg button { flex: 1; border: 0; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  button { font: inherit; background: none; color: var(--fg); border: 1px solid var(--line); padding: 4px 8px; cursor: pointer; }
  button.on { background: var(--accent); color: var(--bg); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  label.layer { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  label.layer span.n { color: var(--muted); margin-left: auto; font-size: 11px; }
  #lidarOpts[hidden], #ptsOpts[hidden], #ptsColorOpts[hidden] { display: none; }
  input[type=range] { width: 100%; }
  #toggle { padding: 0 6px; border: 0; color: var(--muted); }
  #info { right: 16px; bottom: 16px; padding: 10px 12px; width: 260px; display: none; }
  #info h2 { font-size: 14px; margin: 0 0 4px; word-break: break-all; }
  #info table { border-collapse: collapse; width: 100%; }
  #info td { padding: 2px 0; vertical-align: top; }
  #info td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  #hint { position: fixed; left: 16px; bottom: 14px; color: var(--muted); font-size: 11px; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); }
  @media (max-width: 560px) { #ui { width: auto; right: 16px; } #info { left: 16px; width: auto; } #hint { display: none; } }
</style>
</head>
<body>
<div id="ui" class="panel">
  <div class="head"><h1>Angels Knoll / Y-1</h1><button id="toggle" title="Collapse">–</button></div>
  <div class="body">
    <div class="sub">Site model · <a href="./" style="color:inherit">home</a></div>
    <div class="label">Mode</div>
    <div class="seg" id="modes">
      <button data-mode="mesh">Mesh</button>
      <button data-mode="points">Model points</button>
      <button data-mode="lidar">LiDAR</button>
    </div>
    <div id="ptsOpts" hidden>
      <div class="label">Point size (m)</div>
      <input id="ptSize" type="range" min="0.05" max="1.5" step="0.05">
    </div>
    <div id="ptsColorOpts" hidden>
      <div class="label">Point color</div>
      <div class="row" id="ptsColors">
        <button data-c="material">Material</button><button data-c="height">Height</button>
      </div>
    </div>
    <div id="lidarOpts" hidden>
      <div class="label">LiDAR color</div>
      <div class="row" id="lidarColors">
        <button data-c="height">Height</button><button data-c="class">Ground / other</button><button data-c="intensity">Intensity</button>
      </div>
    </div>
    <div class="label">Layers</div>
    <div id="layers"></div>
    <div class="label">Views</div>
    <div class="row" id="views"></div>
  </div>
</div>
<div id="info" class="panel"></div>
<div id="hint">Drag to orbit · right-drag to pan · scroll to zoom · click an object for details</div>
<div id="status">Loading model…</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module" src="js/viewer.js"></script>
</body>
</html>
